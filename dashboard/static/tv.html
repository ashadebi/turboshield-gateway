<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TV Teelee</title><script src="/assets/hls.min.js"></script><script src="/assets/dash.all.min.js"></script><style>body{margin:0;font-family:Inter,Arial;background:#f5f6fa;color:#1A2138}.wrap{display:grid;grid-template-columns:270px 1fr;min-height:100vh}.side{background:#11182d;color:white;padding:18px;overflow:auto}.brand{font-size:20px;font-weight:800}.sub{color:#aeb7d5;font-size:12px;margin:4px 0 16px}.ch{width:100%;text-align:left;border:1px solid #2b355a;background:#17203a;color:white;border-radius:10px;padding:11px;margin:6px 0;cursor:pointer}.ch.on,.ch:hover{background:#4058B0}.main{padding:24px}.title{font-size:24px;font-weight:800}.mut{color:#687089;font-size:13px}.badge{background:#EDF0F8;color:#4058B0;border:1px solid #bdc8ea;border-radius:999px;padding:5px 10px;font-size:12px}.top{display:flex;justify-content:space-between;gap:10px;margin-bottom:16px}.player{background:#000;border-radius:16px;overflow:hidden;box-shadow:0 10px 30px #1a213829}video{width:100%;height:min(68vh,720px);display:block;background:#000}.panel{background:#fff;border:1px solid #dfe4f2;border-radius:14px;padding:16px;margin-top:16px}.mono{font-family:monospace;font-size:12px;word-break:break-all}.err{color:#c0392b}@media(max-width:820px){.wrap{display:block}.side{max-height:42vh}.main{padding:14px}video{height:auto}}</style></head><body><div class="wrap"><aside class="side"><div class="brand">📺 TV Teelee</div><div class="sub">Free-to-air HLS dashboard</div><div id="channels">Memuat…</div></aside><main class="main"><div class="top"><div><div class="title" id="title">Pilih channel</div><div class="mut" id="desc">Klik menu TV di kiri.</div></div><span class="badge" id="status">idle</span></div><div class="player"><video id="video" controls playsinline autoplay></video></div><div class="panel"><b>Info stream</b><div class="mono" id="info">-</div><div class="mut" style="margin-top:10px">HLS diproxy server-side lewat TurboShield. Source tetap milik broadcaster/CDN asal.</div></div></main></div><script>let H=null,CH=[],video=document.getElementById('video');async function loadList(){let r=await fetch('/api/tv/channels'),j=await r.json();CH=j.channels||[];channels.innerHTML=CH.map(c=>`<button class="ch" id="ch-${c.id}" onclick="play('${c.id}')">${c.name}<br><span style="color:#aeb7d5;font-size:11px">${c.group||''}</span></button>`).join('');if(CH[0])play(CH[0].id)}async function play(id){let c=CH.find(x=>x.id===id);if(!c)return;document.querySelectorAll('.ch').forEach(b=>b.classList.remove('on'));let b=document.getElementById('ch-'+id);if(b)b.classList.add('on');title.textContent=c.name;desc.textContent=c.note||'Live stream';info.textContent=c.url;status.textContent='loading';let src='/api/tv/playlist/'+encodeURIComponent(id);if(H){H.destroy();H=null}video.pause();video.removeAttribute('src');video.load();if((c.url||'').includes('.mpd')){if(window.dashjs){H=dashjs.MediaPlayer().create();H.initialize(video,src,true);H.on(dashjs.MediaPlayer.events.ERROR,()=>status.textContent='error')}else{status.innerHTML='<span class="err">browser tidak support DASH</span>';return}}else if(video.canPlayType('application/vnd.apple.mpegurl')){video.src=src;video.play().catch(()=>{})}else if(window.Hls&&Hls.isSupported()){H=new Hls({backBufferLength:60});H.loadSource(src);H.attachMedia(video);H.on(Hls.Events.MANIFEST_PARSED,()=>video.play().catch(()=>{}));H.on(Hls.Events.ERROR,()=>status.textContent='error')}else{status.innerHTML='<span class="err">browser tidak support HLS</span>';return}status.textContent='playing'}video.addEventListener('playing',()=>status.textContent='playing');video.addEventListener('waiting',()=>status.textContent='buffering');video.addEventListener('error',()=>status.textContent='error');loadList().catch(e=>channels.innerHTML='<span class="err">'+e.message+'</span>')</script></body></html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1A2138"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4058B0"/>
      <stop offset="100%" stop-color="#23356f"/>
    </linearGradient>
  </defs>

  <rect width="240" height="240" rx="32" fill="none"/>

  <!-- shield -->
  <path d="M120 18 L190 46 L190 112 Q190 172 120 212 Q50 172 50 112 L50 46 Z" fill="url(#shield)" stroke="#EDF0F8" stroke-width="5"/>
  <path d="M120 30 L176 52 L176 112 Q176 162 120 194 Q64 162 64 112 L64 52 Z" fill="#1A2138" opacity="0.36"/>

  <!-- speed lines -->
  <g stroke="#EDF0F8" stroke-width="5" stroke-linecap="round" opacity="0.75">
    <path d="M25 78 H58"/>
    <path d="M20 100 H52"/>
    <path d="M182 70 H214"/>
    <path d="M188 92 H220"/>
  </g>

  <!-- gorilla head -->
  <g transform="translate(0,2)">
    <!-- ears -->
    <circle cx="82" cy="96" r="18" fill="#13203b" stroke="#EDF0F8" stroke-width="4"/>
    <circle cx="158" cy="96" r="18" fill="#13203b" stroke="#EDF0F8" stroke-width="4"/>
    <circle cx="82" cy="96" r="8" fill="#2d3d67" opacity="0.9"/>
    <circle cx="158" cy="96" r="8" fill="#2d3d67" opacity="0.9"/>

    <!-- head -->
    <ellipse cx="120" cy="122" rx="58" ry="54" fill="#1A2138" stroke="#EDF0F8" stroke-width="5"/>
    <ellipse cx="120" cy="131" rx="42" ry="33" fill="#EDF0F8" opacity="0.12"/>

    <!-- brow -->
    <path d="M82 108 Q120 82 158 108" fill="none" stroke="#EDF0F8" stroke-width="7" stroke-linecap="round"/>

    <!-- eyes -->
    <circle cx="96" cy="118" r="10" fill="#EDF0F8"/>
    <circle cx="144" cy="118" r="10" fill="#EDF0F8"/>
    <circle cx="100" cy="120" r="3.5" fill="#1A2138"/>
    <circle cx="148" cy="120" r="3.5" fill="#1A2138"/>

    <!-- nose -->
    <path d="M108 138 Q120 129 132 138 Q124 151 120 151 Q116 151 108 138 Z" fill="#13203b" stroke="#EDF0F8" stroke-width="3"/>
    <path d="M111 141 Q120 146 129 141" fill="none" stroke="#EDF0F8" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>

    <!-- mouth + teeth -->
    <path d="M100 156 Q120 171 140 156" fill="none" stroke="#EDF0F8" stroke-width="5" stroke-linecap="round"/>
    <path d="M113 156 L113 166" stroke="#EDF0F8" stroke-width="3" stroke-linecap="round"/>
    <path d="M127 156 L127 166" stroke="#EDF0F8" stroke-width="3" stroke-linecap="round"/>

    <!-- grid hint bottom shield -->
    <g opacity="0.35" stroke="#EDF0F8" stroke-width="2">
      <path d="M74 188 H166"/>
      <path d="M84 196 H156"/>
      <path d="M94 204 H146"/>
      <path d="M94 188 V204"/>
      <path d="M120 184 V208"/>
      <path d="M146 188 V204"/>
    </g>
  </g>
</svg>

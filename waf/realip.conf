# ================================================================
# TurboShield — Real IP recovery (http-context)
# Memulihkan IP publik ASLI klien ketika ada layer proxy/NAT di depan.
#
# 2 mekanisme:
#  1) X-Forwarded-For  → jika gateway/LB infra mengirim header ini
#  2) PROXY protocol   → jika infra pakai HAProxy/LB dgn send-proxy (lihat docs)
#
# CIDR di set_real_ip_from = jaringan yang DIPERCAYA (trusted proxies).
# JANGAN percaya 0.0.0.0/0 (spoofing). Hanya subnet infra internal.
# ================================================================

# Trusted internal infra / NAT gateway (sesuaikan dgn jaringanmu)
set_real_ip_from 127.0.0.1;
set_real_ip_from 10.1.1.0/24;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;

# Ambil IP asli dari header X-Forwarded-For (rantai paling kiri yg tak-trusted)
real_ip_header X-Forwarded-For;
real_ip_recursive on;

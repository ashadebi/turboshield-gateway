# ==============================================================
# TurboShield — Managed Rules (DIKELOLA DASHBOARD, jangan edit manual)
# Dimuat setelah OWASP CRS. Dashboard menulis ulang file ini lalu reload nginx.
# ==============================================================

# Engine mode: On (blocking) | DetectionOnly | Off
SecRuleEngine On

# OWASP CRS anomaly scoring threshold (dashboard-tunable)
SecAction "id:90000,phase:1,pass,nolog,\
  setvar:tx.inbound_anomaly_score_threshold=5,\
  setvar:tx.outbound_anomaly_score_threshold=4"

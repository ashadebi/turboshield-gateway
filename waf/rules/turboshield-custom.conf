# ==============================================================
# TurboShield — Custom WAF Rules (dimuat SETELAH OWASP CRS)
# File ini tempat aturan khusus: whitelist, blacklist, tuning.
# ID range 90000+ dipakai TurboShield agar tak bentrok dgn CRS.
# ==============================================================

# Catatan: SecRuleEngine dikontrol via env MODSEC_RULE_ENGINE (jangan di-set di sini).

# --- Rate limiting sederhana berbasis IP (in-memory collection) ---
# Ambil koleksi per-IP
SecAction "id:90100,phase:1,pass,nolog,initcol:ip=%{REMOTE_ADDR}"
# Hitung request per IP
SecAction "id:90101,phase:1,pass,nolog,setvar:ip.req_count=+1,expirevar:ip.req_count=10"
# Jika >100 request per 10 detik -> blokir 429 (burst protection)
SecRule IP:REQ_COUNT "@gt 100" \
  "id:90102,phase:1,deny,status:429,log,\
  msg:'TurboShield Rate-Limit: burst melebihi 100 req / 10 detik',\
  tag:'turboshield/rate-limit'"

# --- Contoh whitelist IP kantor (nonaktif; aktifkan bila perlu) ---
# SecRule REMOTE_ADDR "@ipMatch 203.0.113.0/24" \
#   "id:90200,phase:1,pass,nolog,ctl:ruleEngine=Off,\
#   msg:'TurboShield Whitelist: IP kantor Turbo Internet'"

# --- Contoh blokir User-Agent scanner tertentu ---
SecRule REQUEST_HEADERS:User-Agent "@pmFromFile /etc/modsecurity.d/turboshield-bad-agents.data" \
  "id:90300,phase:1,deny,status:403,log,\
  msg:'TurboShield: User-Agent scanner diblokir',\
  tag:'turboshield/bad-agent'"
